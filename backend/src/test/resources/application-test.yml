spring:
  datasource:
    url: jdbc:h2:mem:myblog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.myblog.domain,com.example.myblog.domain.view
  configuration:
    map-underscore-to-camel-case: true
app:
  oss:
    endpoint: oss-cn-test.aliyuncs.com
    bucket: test-bucket
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    default-cover-url: https://test.example.com/default-cover.png
